<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🍈 Melon Artist Chart</title>
  <link rel="stylesheet" href="style.css?v=20261009-4">
</head>
<body>
  <main class="container">
    <header class="hero">
      <div>
        <a id="homeLink" class="brand-link" href="/" aria-label="Melonitor 첫 화면으로"><h1>🍈 Melon Artist Chart</h1></a>
        <p>아티스트를 검색하면 현재 멜론 TOP100 순위를 보여드립니다.</p>
      </div>
      <div class="hero-tools">
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="다크 모드로 전환" title="다크 모드로 전환">🌙</button>
        <div id="updated" class="updated">불러오는 중...</div>
      </div>
    </header>

    <section class="search">
      <label for="artistSearch">아티스트 검색</label>
      <div class="search-row">
        <input id="artistSearch" type="search" placeholder="예: NMIXX, 엔믹스, RESCENE, 리센느, 최예나" autocomplete="off">
        <button id="clearBtn" type="button">지우기</button>
      </div>
      <h2 class="popular-heading">인기 검색어</h2>
      <p id="popularNote" class="popular-note">검색을 시작하면 이 브라우저에서 많이 검색한 아티스트 순으로 표시됩니다.</p>
      <div id="popular" class="chips" aria-label="인기 검색어 순위"></div>
    </section>

    <section>
      <div id="summary" class="summary">아티스트를 검색해 주세요.</div>
      <div id="results" class="results"></div>
    </section>

    <section class="report-teaser" aria-labelledby="reportTeaserTitle">
      <div class="report-teaser-copy">
        <span class="report-kicker">HELP & FEEDBACK</span>
        <h2 id="reportTeaserTitle">오류 게시판</h2>
        <p>검색이나 차트 표시에서 이상한 점을 발견했나요? 오류 제보 페이지에서 알려주세요.</p>
      </div>
      <a class="report-open-link" href="/errors.html">오류 게시판 열기 <span aria-hidden="true">→</span></a>
    </section>
  </main>

  <template id="songTemplate">
    <article class="song">
      <div class="rank"></div>
      <div class="change"></div>
      <img class="album-image" alt="" loading="lazy">
      <div class="song-info">
        <div class="title"></div>
        <div class="artist"></div>
        <div class="album"></div>
      </div>
    </article>
  </template>

  <script src="app.js?v=20261009-11"></script>
  <script src="theme.js?v=2"></script>
</body>
</html>
