name: Update Public Melon Chart

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-site-data:
    runs-on: ubuntu-latest

    steps:
      - name: 배포용 브랜치 가져오기
        uses: actions/checkout@v4
        with:
          ref: web-app
          fetch-depth: 1

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 멜론 TOP100 업데이트
        run: python build_chart.py

      - name: chart.json 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add chart.json

          if git diff --cached --quiet; then
            echo "변경된 차트 데이터가 없습니다."
          else
            git commit -m "Update public Melon chart data"
            git push origin HEAD:web-app
          fi
