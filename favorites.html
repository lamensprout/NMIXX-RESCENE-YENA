        <p>멜론 TOP100 아티스트 검색</p>
      </div>
      <nav class="main-nav" aria-label="주요 메뉴">
        <a href="/">홈으로 이동</a>
        <a href="/favorites.html" aria-current="page">좋아하는 아티스트</a>
        <a href="/feedback.html">피드백</a>
        <a href="https://www.melon.com/chart/index.htm" target="_blank" rel="noopener noreferrer">멜론차트 공식 사이트 <span aria-hidden="true">↗</span></a>

      <div class="hero-tools">
        <div class="user-menu">
          <button id="userMenuToggle" class="user-menu-trigger" type="button" aria-label="사용자 메뉴 열기" aria-expanded="false" aria-controls="userMenuPanel">
            <img class="user-menu-avatar" alt="" aria-hidden="true" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <circle cx="12" cy="7.2" r="3.35" fill="none" stroke="currentColor" stroke-width="1.65"></circle>
              <path d="M4.1 20v-1.25c0-2.65 2.05-4.65 4.65-4.65h6.5c2.6 0 4.65 2 4.65 4.65V20H4.1Z" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
          </button>
          <div id="userMenuPanel" class="user-menu-panel" role="menu" aria-label="사용자 설정" hidden>
            <a id="accountLink" class="user-menu-item" href="/account.html" role="menuitem">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M10 3H4.8A1.8 1.8 0 0 0 3 4.8v14.4A1.8 1.8 0 0 0 4.8 21H10v-2H5V5h5V3Zm4.6 4.4-1.4 1.4 2.2 2.2H9v2h6.4l-2.2 2.2 1.4 1.4 4.6-4.6-4.6-4.6Z"></path>
              </svg>
              <span id="accountLinkLabel">로그인 / 회원가입</span>
            </a>
            <div class="user-menu-divider" role="separator"></div>
            <div class="user-theme-section">
              <div class="user-theme-heading">화면 모드</div>
              <div id="themeModeControl" class="theme-mode-control" data-active-mode="auto" role="group" aria-label="화면 모드 선택">
                <button class="theme-mode-option" type="button" data-theme-mode="light" aria-pressed="false">라이트</button>
                <button class="theme-mode-option" type="button" data-theme-mode="auto" aria-pressed="true">AUTO</button>
                <button class="theme-mode-option" type="button" data-theme-mode="dark" aria-pressed="false">다크</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <section class="favorites-panel favorite-page-panel" aria-labelledby="favoriteTitle">
      <div class="favorites-heading">
        <div>
          <h2 id="favoriteTitle">좋아하는 아티스트</h2>
          <p>아티스트별 현재 TOP100 최고 순위와 최근 24시간 순위 변화를 확인할 수 있어요. 아티스트명을 누르면 해당 아티스트의 곡만 볼 수 있습니다.</p>
        </div>
      </div>

      <div class="rank-graph-settings">
        <label for="rankGraphColor">순위 그래프 색상</label>
        <input id="rankGraphColor" type="color" value="#168a35" aria-label="순위 그래프 색상 선택">
        <span id="rankGraphColorValue">#168A35</span>
      </div>
      <p id="rankHistoryStatus" class="rank-history-status" role="status" aria-live="polite">순위 기록을 불러오는 중...</p>

      <form id="favoriteForm" class="favorite-form" hidden>
        <label class="visually-hidden" for="favoriteInput">즐겨찾기 아티스트 이름</label>
        <input id="favoriteInput" type="search" maxlength="100" placeholder="아티스트 이름 검색 (예: 엔믹스)" autocomplete="off" aria-controls="favoriteSearchResults" aria-expanded="false">
        <button id="favoriteAddButton" type="submit" class="primary-button" disabled>아티스트 추가</button>
      </form>
      <div id="favoriteSearchResults" class="favorite-search-results" role="listbox" aria-label="아티스트 검색 결과" hidden></div>
      <p id="favoritesNote" class="favorites-note" role="status" aria-live="polite">계정 확인 중...</p>
      <div id="favoriteArtists" class="chips favorite-list" aria-label="좋아하는 아티스트 목록" hidden></div>

      <div id="favoritesLoginGate" class="favorites-login-gate" hidden>
        <p>좋아하는 아티스트 목록을 보거나 수정하려면 로그인하고 가입 설정을 완료해 주세요.</p>
        <a class="primary-button favorites-login-button" href="/account.html">로그인 / 회원가입</a>
      </div>
    </section>

    
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js?v=1"></script>
  <script src="monitor-store.js?v=12"></script>
  <script src="profile-avatar.js?v=2"></script>
  <script src="favorites.js?v=20261027-1"></script>
  <script src="theme.js?v=5"></script>
  <script>
    (() => {
      const toggle = document.getElementById("userMenuToggle");
      const panel = document.getElementById("userMenuPanel");
      const account = document.getElementById("accountLink");
      const themeOptions = panel ? panel.querySelectorAll("[data-theme-mode]") : [];
      if (!toggle || !panel) return;
      function closeMenu() {
        panel.hidden = true;
        toggle.setAttribute("aria-expanded", "false");
        toggle.setAttribute("aria-label", "사용자 메뉴 열기");
      }
      function openMenu() {
        panel.hidden = false;
        toggle.setAttribute("aria-expanded", "true");
        toggle.setAttribute("aria-label", "사용자 메뉴 닫기");
      }
      toggle.addEventListener("click", () => panel.hidden ? openMenu() : closeMenu());
      document.addEventListener("click", event => {
        if (!panel.hidden && !event.target.closest(".user-menu")) closeMenu();
      });
      document.addEventListener("keydown", event => {
        if (event.key === "Escape" && !panel.hidden) {
          closeMenu();
          toggle.focus();
        }
      });
      if (account) account.addEventListener("click", closeMenu);
      themeOptions.forEach(option => option.addEventListener("click", closeMenu));
    })();
  </script>
</body>
</html>
